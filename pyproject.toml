[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "accacia"
version = "0.1.0"
description = "Solar EPC enquiry-to-quote engine for C&I rooftop deals (India 2026)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
accacia = "accacia.cli:main"

[tool.setuptools]
packages = ["accacia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
