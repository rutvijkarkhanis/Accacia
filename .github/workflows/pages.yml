name: Deploy site to GitHub Pages

# Serves the self-contained web/ front-end as the Pages site.
# Enable once in repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". After that, this deploys on every push to main and can be
# run manually from the Actions tab.

on:
  push:
    branches: [main, claude/solar-epc-knowledge-bank-hoh718]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Attempt to enable Pages (source: GitHub Actions) via the API so no
          # manual Settings toggle is needed. If repo policy blocks token-based
          # enablement, enable it once in Settings -> Pages -> Source: GitHub Actions.
          enablement: true
      - name: Upload site (web/ as the root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
